<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPX Heat Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="panel">
    <h1>GPX Heat Map</h1>
    <p class="hint">Tus archivos se procesan en tu navegador. No se suben a ningún servidor.</p>

    <label id="drop" for="file-input">
      <strong>Arrastra tus GPX aquí</strong>
      <span>o pulsa para seleccionarlos</span>
      <input id="file-input" type="file" accept=".gpx,application/gpx+xml" multiple hidden>
    </label>

    <div id="stats"></div>
    <ul id="file-list"></ul>

    <details open>
      <summary>Mapa de calor</summary>
      <label>Radio <output id="o-radius"></output><input id="radius" type="range" min="1" max="30" value="6"></label>
      <label>Difuminado <output id="o-blur"></output><input id="blur" type="range" min="1" max="30" value="8"></label>
      <label>Intensidad <output id="o-max"></output><input id="max" type="range" min="1" max="100" value="30"></label>
      <label>Opacidad <output id="o-opacity"></output><input id="opacity" type="range" min="10" max="100" value="85"></label>
      <label>Densificar cada (m) <output id="o-step"></output><input id="step" type="range" min="2" max="100" value="15"></label>
    </details>

    <details open>
      <summary>Mapa base</summary>
      <select id="basemap"></select>
      <label class="check"><input id="show-tracks" type="checkbox"> Mostrar trazas</label>
    </details>

    <div class="row">
      <button id="fit" type="button">Ajustar vista</button>
      <button id="clear" type="button">Limpiar todo</button>
    </div>
  </aside>
  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
